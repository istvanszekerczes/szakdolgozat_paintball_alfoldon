<dialog #dialog class="dialog" [attr.aria-labelledby]="titleId" (close)="closed.emit()">
  <form class="dialog-form" (submit)="submit($event)">
    <h2 [id]="titleId">{{ title() }}</h2>
    <ng-content />
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" (click)="dialog.close()">
        {{ saveLabel() ? cancelLabel() : 'Bezárás' }}
      </button>
      @if (saveLabel()) {
        <button class="btn btn-primary" type="submit" [disabled]="busy()">
          {{ busy() ? 'Mentés…' : saveLabel() }}
        </button>
      }
    </div>
  </form>
</dialog>
