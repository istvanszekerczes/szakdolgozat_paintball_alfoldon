<ul class="venues" role="list">
  @for (venue of venues(); track venue.slug) {
    <li>
      <button
        type="button"
        class="venue card card-interactive"
        [class.is-selected]="venue.slug === selected()"
        [attr.aria-pressed]="venue.slug === selected()"
        (click)="picked.emit(venue.slug)"
      >
        <span class="venue-head">
          <span class="venue-city">{{ venue.city }}</span>
          <span class="pill" [class.pill-accent]="venue.indoor">{{
            (venue.indoor ? 'common.indoor' : 'common.outdoor') | translate
          }}</span>
        </span>
        <span class="venue-name">{{ venueName(venue) }}</span>
        <span class="venue-meta mono">{{
          'common.people' | translate: { count: venue.minHeadcount + '–' + venue.maxHeadcount }
        }}</span>
      </button>
    </li>
  }
</ul>
