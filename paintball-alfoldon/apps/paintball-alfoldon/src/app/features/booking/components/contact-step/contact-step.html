<div class="field">
  <label for="bw-name" class="field-label">{{ 'booking.name' | translate }}</label>
  <input
    id="bw-name"
    type="text"
    class="input"
    autocomplete="name"
    [placeholder]="'booking.namePlaceholder' | translate"
    [formField]="form().name"
    [attr.aria-invalid]="showsError(form().name)"
    [attr.aria-describedby]="showsError(form().name) ? 'bw-name-error' : null"
  />
  <app-field-errors [field]="form().name" errorId="bw-name-error" />
</div>

<div class="row">
  <div class="field">
    <label for="bw-email" class="field-label">{{ 'booking.email' | translate }}</label>
    <input
      id="bw-email"
      type="email"
      inputmode="email"
      class="input"
      autocomplete="email"
      [placeholder]="'booking.emailPlaceholder' | translate"
      [formField]="form().email"
      [attr.aria-invalid]="showsError(form().email)"
      [attr.aria-describedby]="showsError(form().email) ? 'bw-email-error' : null"
    />
    <app-field-errors [field]="form().email" errorId="bw-email-error" />
  </div>

  <div class="field">
    <label for="bw-phone" class="field-label">{{ 'booking.phone' | translate }}</label>
    <input
      id="bw-phone"
      type="tel"
      inputmode="tel"
      class="input"
      autocomplete="tel"
      [placeholder]="'booking.phonePlaceholder' | translate"
      [formField]="form().phone"
      [attr.aria-invalid]="showsError(form().phone)"
      [attr.aria-describedby]="showsError(form().phone) ? 'bw-phone-error' : null"
    />
    <app-field-errors [field]="form().phone" errorId="bw-phone-error" />
  </div>
</div>
