<div class="field">
  <label for="bw-headcount" class="field-label">{{ 'booking.headcount' | translate }}</label>
  <input
    id="bw-headcount"
    type="number"
    inputmode="numeric"
    class="input count"
    [formField]="form().headcount"
    [attr.aria-invalid]="showsError(form().headcount)"
    [attr.aria-describedby]="
      showsError(form().headcount) ? 'bw-headcount-error' : 'bw-headcount-hint'
    "
  />
  @if (showsError(form().headcount)) {
    <app-field-errors [field]="form().headcount" errorId="bw-headcount-error" />
  } @else if (venue(); as v) {
    <p id="bw-headcount-hint" class="hint">
      {{ 'booking.headcountHint' | translate: { min: v.minHeadcount, max: v.maxHeadcount } }}
    </p>
  }
</div>

<div class="field">
  <label for="bw-note" class="field-label">{{ 'booking.note' | translate }}</label>
  <textarea
    id="bw-note"
    class="input"
    rows="4"
    [formField]="form().note"
    [placeholder]="'booking.notePlaceholder' | translate"
    [attr.aria-invalid]="showsError(form().note)"
    [attr.aria-describedby]="showsError(form().note) ? 'bw-note-error' : 'bw-note-hint'"
  ></textarea>
  @if (showsError(form().note)) {
    <app-field-errors [field]="form().note" errorId="bw-note-error" />
  } @else {
    <p id="bw-note-hint" class="hint">
      {{ 'booking.noteCount' | translate: { count: form().note().value().length, max: noteMax } }}
    </p>
  }
</div>
