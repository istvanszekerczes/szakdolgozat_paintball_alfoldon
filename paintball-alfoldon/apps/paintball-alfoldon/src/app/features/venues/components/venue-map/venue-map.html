<div class="map-shell venue-map-single">
  <div
    #mapContainer
    class="map-shell-canvas"
    role="region"
    [attr.aria-label]="
      'map.venueAria' | translate: { city: location().city, venue: location().venue }
    "
  ></div>

  @switch (status()) {
    @case ('loading') {
      <div class="map-shell-status" aria-live="polite">{{ 'map.loading' | translate }}</div>
    }
    @case ('error') {
      <div class="map-shell-status" role="status">
        {{ 'map.error' | translate }}
      </div>
    }
  }
</div>
