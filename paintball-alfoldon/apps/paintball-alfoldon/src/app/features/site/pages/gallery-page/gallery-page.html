<section class="page-header">
  <div class="container">
    <span class="eyebrow">{{ 'gallery.eyebrow' | translate }}</span>
    <h1 class="page-header-title">{{ 'gallery.title' | translate }}</h1>
    <p class="page-header-lead lead">
      {{ 'gallery.lead' | translate }}
    </p>
  </div>
</section>

<section class="section">
  <div class="container gallery-page">
    <!--
      INTEGRATION: to show real photos (e.g. Facebook Graph API or an external gallery), fill in
      "src" in the Gallery component's "items".
    -->
    <app-gallery />

    <aside class="card fb-note">
      <span class="fb-note-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
        </svg>
      </span>
      <div class="fb-note-text">
        <h2 class="fb-note-title">{{ 'gallery.fbTitle' | translate }}</h2>
        <p>
          {{ 'gallery.fbBefore' | translate }}
          <a
            href="https://facebook.com/PaintballAlfoldon"
            target="_blank"
            rel="noopener"
            class="fb-note-link"
            >{{ 'gallery.fbLink' | translate }}</a
          >{{ 'gallery.fbAfter' | translate }}
        </p>
      </div>
    </aside>
  </div>
</section>
