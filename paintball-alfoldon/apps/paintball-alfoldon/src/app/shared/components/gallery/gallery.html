<ul class="gallery" [attr.aria-label]="'gallery.listAria' | translate">
  @for (item of items; track item.caption; let i = $index) {
    <li>
      <button
        type="button"
        class="tile"
        (click)="open(i)"
        [attr.aria-label]="'gallery.open' | translate: { caption: item.caption | translate }"
      >
        <span class="tile-media" aria-hidden="true">
          <span class="tile-index mono">{{ pad(i + 1) }}</span>
        </span>
        <span class="tile-caption">{{ item.caption | translate }}</span>
      </button>
    </li>
  }
</ul>

@if (active(); as idx) {
  <div class="lightbox" (click)="onBackdrop($event)" (keydown)="onKeydown($event)">
    <div
      class="lightbox-dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="items[idx.value].caption | translate"
    >
      <button
        #closeBtn
        type="button"
        class="lightbox-btn lightbox-close"
        (click)="close()"
        [attr.aria-label]="'common.close' | translate"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>

      <figure class="lightbox-figure">
        <div class="lightbox-media" aria-hidden="true">
          <span class="lightbox-index mono"
            >{{ pad(idx.value + 1) }} / {{ pad(items.length) }}</span
          >
        </div>
        <figcaption class="lightbox-caption">{{ items[idx.value].caption | translate }}</figcaption>
      </figure>

      <div class="lightbox-nav">
        <button
          type="button"
          class="lightbox-btn"
          (click)="prev()"
          [attr.aria-label]="'gallery.previous' | translate"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button
          type="button"
          class="lightbox-btn"
          (click)="next()"
          [attr.aria-label]="'gallery.next' | translate"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
    </div>
  </div>
}
