spring.application.name=paintball-backend

# Database: production values come from environment variables, local defaults are in application-dev.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Booking rules (see AppProperties.Booking)
app.booking.min-days-in-advance=7
app.booking.max-days-in-advance=365
app.booking.slot-starts=08:00,10:00,12:00,14:00,16:00,18:00
app.booking.slot-length=2h
app.booking.time-zone=Europe/Budapest

# CORS: the public site may only call public endpoints, the dashboard only /api/admin/**
app.cors.public-origins=${CORS_PUBLIC_ORIGINS:https://paintball-alfoldon.hu,https://www.paintball-alfoldon.hu}
app.cors.admin-origins=${CORS_ADMIN_ORIGINS:https://admin.paintball-alfoldon.hu}

# Admin authentication
app.security.jwt-secret=${JWT_SECRET}
app.security.token-ttl=8h
app.security.bootstrap-username=${ADMIN_USERNAME:}
app.security.bootstrap-password=${ADMIN_PASSWORD:}
