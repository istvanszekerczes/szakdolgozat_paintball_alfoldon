# In-memory database for tests; Flyway runs the same migrations as production.
spring.datasource.url=jdbc:h2:mem:paintball;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

app.cors.public-origins=http://localhost:4200
app.cors.admin-origins=http://localhost:4300

app.security.jwt-secret=test-secret-test-secret-test-secret-123
app.security.bootstrap-username=admin
app.security.bootstrap-password=admin-password
